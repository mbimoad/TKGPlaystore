<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.1/css/dataTables.dataTables.css" />
    
</head>
<body class="light">
    <header>
        <div class="logo">
            <img src="./assets/svg/app.svg">
            <span>TT-IT Store</span>
        </div>

        <div class="finder">
            <input type="text" placeholder="Search apps, website and etc">
            <img src="./assets/svg/search.svg" class="svgimg">
        </div>

        <div class="user">
            <img src="./assets/svg/user.svg" class="svgimg">
            <div class="user-info">
                <p>TT24010584</p>
                <span>Muhammad Bimoadjie Dwintoro</span>
            </div>
        </div>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>


    <aside>
        <ul>
            <li class="active">
                <img class="svgimg" src="./assets/svg/home.svg">
                <span href="#">Home</span>
            </li>
            <li>
                <img class="svgimg" src="./assets/svg/desktop.svg">
                <span href="#">Desktop</span>
            </li>
            <li>
                <img class="svgimg" src="./assets/svg/mobile.svg">
                <span href="#">Mobile</span>
            </li>
        </ul>

        <ul>
            <li>
                <img class="svgimg" src="./assets/svg/darkmode.svg">
                <span href="#">Dark Mode</span>
            </li>
            <li>
                <img class="svgimg" src="./assets/svg/download.svg">
                <span href="#">Downloads</span>
            </li>
            <li>
                <img class="svgimg" src="./assets/svg/library.svg">
                <span href="#">Library</span>
            </li>
        </ul>
    </aside>

    <section class="main">

        <div class="sticky-menu">
            <h2>Library</h2>

            <div class="menu">
                <div class="buttons">
                    <button class="active">All</button>
                    <button>Dekstop</button>
                    <button>Mobile</button>
                </div>
                <div class="input">
                    <div class="search">
                        <input type="text" placeholder="Search" class="custom-search">
                        <img src="./assets/svg/search.svg">
                    </div>


                    <div class="sort">
                        <img src="./assets/svg/sort.svg" class="sort-btn">
                        <div class="popup">
                            <div class="item active" >
                                <img src="./assets/svg/check.svg" alt="">
                                <span>Sort By Date</span>
                            </div>
                            <div class="item">
                                <img src="./assets/svg/check.svg" alt="">
                                <span>Sort By Name</span>
                            </div>
                            <div class="item">
                                <img src="./assets/svg/check.svg" alt="">
                                <span>Sort By Category</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="libraries">
            <table id="myTable" class="display">
                <thead>
                    <tr style="display: none;">
                        <th>Application</th>
                        <th>Categories</th>
                        <th>Creation Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    
        
                </tbody>
            </table>
        </div>
    </section>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/2.2.1/js/dataTables.js"></script>
    <script src="./assets/scripts/myscript.js"></script>
    <script src="./assets/scripts/libraries.js"></script>
</body>
</html>
